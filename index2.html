<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All About You — Lyric Player</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="bg-image" id="bg-image"></div>
  <div class="bg-overlay"></div>

  <div class="rail">
    <div class="rail-line"></div>
    <div class="rail-fill" id="rail-fill"></div>
    <!-- tick marks injected by JS, one per lyric line -->
  </div>

  <header>
    <div class="eyebrow">Now playing · placeholder lyric sync</div>
    <div class="title-block">
      <h1>All About You</h1>
      <span class="artist">The 1975</span>
    </div>
  </header>

  <main>
    <div class="lyric-stack" id="lyric-stack">
      <div class="empty-state" id="empty-state">
        Load an audio file to start playback.<br>
        Lyric text and timestamps are placeholders —<br>
        edit the <span class="fname">LYRICS</span> array in the source to sync your own.
      </div>
    </div>
  </main>

  <footer>
    <button class="play-btn" id="play-btn" aria-label="Play" disabled>
      <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <div class="transport-mid">
      <span class="time" id="time-current">0:00</span>
      <input type="range" id="scrubber" min="0" max="100" value="0" step="0.1" disabled aria-label="Seek">
      <span class="time" id="time-total">0:00</span>
    </div>

    <div class="volume-control">
      <button class="volume-btn" id="volume-btn" aria-label="Mute">
        <svg id="volume-icon" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 5V4L8 9H4z"/>
          <path id="vol-wave-1" d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path id="vol-wave-2" d="M18 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1" aria-label="Volume">
    </div>

    <button class="load-btn" id="load-btn">Load audio</button>
    <input type="file" id="file-input" accept="audio/*">
  </footer>

  <audio id="audio" preload="metadata"></audio>

<script src="script.js"></script>

</body>
</html>
